<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>
    <linearGradient id="grid-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)" rx="12" />

  <!-- Animated Dynamic Background Grid Pulse & Energy Waves -->
  <g opacity="0.25">
    <line x1="0" y1="50" x2="1200" y2="50" stroke="url(#grid-line)" stroke-width="1" />
    <line x1="0" y1="100" x2="1200" y2="100" stroke="url(#grid-line)" stroke-width="1" />
    <line x1="0" y1="150" x2="1200" y2="150" stroke="url(#grid-line)" stroke-width="1" />
    <line x1="0" y1="200" x2="1200" y2="200" stroke="url(#grid-line)" stroke-width="1" />
    <line x1="0" y1="250" x2="1200" y2="250" stroke="url(#grid-line)" stroke-width="1" />
  </g>

  <!-- Dynamic Wave Paths (Low Opacity, Behind Text) -->
  <path d="M0,220 Q300,160 600,220 T1200,180" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.35">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0,220 Q300,160 600,220 T1200,180; M0,180 Q300,240 600,170 T1200,220; M0,220 Q300,160 600,220 T1200,180" />
  </path>
  <path d="M0,240 Q300,280 600,200 T1200,230" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.3">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="M0,240 Q300,280 600,200 T1200,230; M0,200 Q300,150 600,240 T1200,190; M0,240 Q300,280 600,200 T1200,230" />
  </path>

  <!-- Glowing Nodes / Energy Flow Particles -->
  <circle cx="150" cy="220" r="4" fill="#38bdf8" opacity="0.8">
    <animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="450" cy="180" r="5" fill="#818cf8" opacity="0.8">
    <animate attributeName="r" values="4;8;4" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="850" cy="210" r="4" fill="#c084fc" opacity="0.8">
    <animate attributeName="r" values="3;7;3" dur="3.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="190" r="5" fill="#38bdf8" opacity="0.8">
    <animate attributeName="r" values="3;6;3" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite" />
  </circle>

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle">
    <!-- Badge Pill Top -->
    <rect x="440" y="40" width="320" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="600" y="60" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">⚡ CURATED DERMS ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="130" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">Awesome Distributed Energy Resource Management</text>
    
    <!-- Subtitle -->
    <text x="600" y="175" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">DER Orchestration • Grid-Edge Control • VPP Aggregation • Distribution Optimization</text>

    <!-- Tech Stack Pill Tags -->
    <g transform="translate(0, 215)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">
      <!-- Pill 1 -->
      <rect x="310" y="0" width="130" height="28" rx="14" fill="#0f172a" stroke="#334155" />
      <text x="375" y="18" fill="#cbd5e1">☀️ Solar &amp; BESS</text>
      <!-- Pill 2 -->
      <rect x="455" y="0" width="130" height="28" rx="14" fill="#0f172a" stroke="#334155" />
      <text x="520" y="18" fill="#cbd5e1">🔌 EV Orchestration</text>
      <!-- Pill 3 -->
      <rect x="600" y="0" width="145" height="28" rx="14" fill="#0f172a" stroke="#334155" />
      <text x="672" y="18" fill="#cbd5e1">🔋 Virtual Power Plant</text>
      <!-- Pill 4 -->
      <rect x="760" y="0" width="130" height="28" rx="14" fill="#0f172a" stroke="#334155" />
      <text x="825" y="18" fill="#cbd5e1">🌐 IEEE 1547 / CIM</text>
    </g>
  </g>
</svg>
